<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Track your order — LuthuliScents</title>
    <meta name="description" content="Track your LuthuliScents parcel with your Courier Guy waybill or tracking reference and see live delivery updates." />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-active="track"
        data-hero-title="Where is my parcel?"
        data-hero-subtitle="Enter the waybill / tracking reference you received to see live delivery updates from The Courier Guy."
        data-hero-float="gold-splat.png">
    <div id="site-header"></div>
    <div id="site-hero"></div>

    <main class="container page" style="max-width:720px;">

      <section class="trackbox">
        <h2>Track your parcel</h2>
        <p class="caption">You will find your tracking reference in the WhatsApp message or email we sent you once your order was handed to The Courier Guy.</p>
        <form id="track-form" class="track-search">
          <div>
            <label for="track-ref">Waybill / tracking reference</label>
            <input id="track-ref" name="ref" type="text" placeholder="e.g. TCG12345678" autocomplete="off" />
          </div>
          <div class="full">
            <button class="btn primary" type="submit">Track parcel</button>
          </div>
        </form>
        <div id="track-notice"></div>
      </section>

      <section id="track-result" hidden></section>

    </main>

    <div id="site-footer"></div>

    <script src="js/data.js"></script>
    <script src="js/site.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/track.js"></script>
  </body>
</html>
